//  VIEW: TURNOS (solo dueño)
// ══════════════════════════════════════════════════════
async function renderTurnos() {
  const el=$('#view-turnos'); if(!el) return;
  const hoy=new Date().toISOString().slice(0,10);
  const dias=[];
  let d=new Date(hoy+'T12:00:00');
  for(let i=0;i<6;i++){
    const iso=d.toISOString().slice(0,10);
    dias.push(iso);
    d.setDate(d.getDate()+1);
  }
  const todosTurnos=await dbGetAll('turnos');
  const activos=todosTurnos.filter(t=>['pendiente','confirmado'].includes(t.estado));

  el.innerHTML=`
    <p class="view-title">📅 Turnos</p>
    <p class="view-sub">Próximos 6 días — ${activos.length} turno${activos.length!==1?'s':''} pendiente${activos.length!==1?'s':''}</p>
    ${dias.map(iso=>{
      const del_dia=activos.filter(t=>t.fecha===iso).sort((a,b)=>a.hora.localeCompare(b.hora));
      const label=fdateDay(iso)+(iso===hoy?' (Hoy)':'');
      return `
        <div class="section-head" style="margin-top:20px">${label}</div>
        ${del_dia.length===0
          ? `<div style="color:var(--muted);font-size:.82rem;padding:10px 0">Sin turnos</div>`
          : del_dia.map(t=>`
          <div class="card" style="border-left:3px solid var(--gold);margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <div style="font-weight:600;font-size:.95rem">${t.clienteNombre}</div>
                <div style="color:var(--muted);font-size:.78rem;margin-top:3px">
                  🕐 ${t.hora} hs · ${t.tipoLabel||t.tipoVehiculo} · ${t.servicioNombre}
                </div>
              </div>
              <div style="text-align:right">
                <div class="text-gold" style="font-weight:700">${fmoney(t.precio||0)}</div>
                <span class="chip chip-wait" style="font-size:.65rem;margin-top:4px;display:inline-block">${t.estado}</span>
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="btn btn-secondary btn-sm" onclick="cancelarTurno('${t.id}')">🚫 Cancelar</button>
              <button class="btn btn-primary btn-sm" onclick="confirmarTurnoLlegada('${t.id}')">✅ Llegó</button>
            </div>
          </div>`).join('')}`;
    }).join('')}
  `;
}

async function cancelarTurno(id) {
  confirmModal('¿Cancelar este turno? Se notificará en el historial.', async () => {
    const turnos=await dbGetAll('turnos');
    const t=turnos.find(x=>x.id===id); if(!t) return;
    await dbPut('turnos',{...t,estado:'cancelado'});
    toast('Turno cancelado','info');
    renderTurnos();
  },'Cancelar turno','btn-danger');
}

async function confirmarTurnoLlegada(id) {
  const turnos=await dbGetAll('turnos');
  const t=turnos.find(x=>x.id===id); if(!t) return;
  // Crear un lavado en cola a partir del turno
  const svcs=await dbGetAll('servicios');
  const svc=svcs.find(s=>s.id===t.servicioId);
  const user=auth.get();
  const emps=(await dbGetAll('empleados')).filter(e=>e.activo===true&&e.rol!=='dueno');
  const comisionesGrupal=emps.map(e=>({
    empleadoId:e.id, nombre:e.nombre,
    pct:svc?.comisionPct??e.comisionPct??15,
    monto:Math.round(((t.precio||svc?.precio||0)*(svc?.comisionPct??e.comisionPct??15))/100)
  }));
  await dbPut('lavados',{
    clienteId:t.clienteId, clienteNombre:t.clienteNombre, clienteTelefono:t.clienteTelefono,
    patente:'', marcaVehiculo:'', modeloVehiculo:'', tipoVehiculo:t.tipoVehiculo,
    servicioId:t.servicioId, servicioNombre:t.servicioNombre,
    empleadoId:user?.id||'', estado:'en_espera',
    fechaInicio:new Date().toISOString(), fechaFin:null,
    precio:t.precio||svc?.precio||0, comisionesGrupal,
    comisionMonto:comisionesGrupal.reduce((a,c)=>a+c.monto,0),
    notas:'Turno reservado online', origen:'reserva', turnoId:t.id
  });
  await dbPut('turnos',{...t,estado:'confirmado'});
  toast('Vehículo agregado a la cola del día ✔','success');
  navTo('dia');
}
window.cancelarTurno=cancelarTurno;
window.confirmarTurnoLlegada=confirmarTurnoLlegada;

// ═══════════════════════════════════════════════════════════════
//  HASH ROUTER
// ═══════════════════════════════════════════════════════════════
function handleHash() {
  const hash=location.hash||'#/';
  if(hash==='#/reserva') { showScreen('reserva'); renderReserva(); }
  else if(hash.startsWith('#/')) {
    const user=auth.get();
    if(!user) { showScreen('login'); }
    else { goTo('main'); renderView(auth.isDueno()?'dashboard':'registro'); }
  }
}
window.addEventListener('hashchange', handleHash);

// ═══════════════════════════════════════════════════════════════
//  APP INIT
// ═══════════════════════════════════════════════════════════════
async function appInit() {
  try {
    await dbOpen();
  } catch(e) {
    console.error('DB Init error:', e);
  }
  // Ocultar splash inmediatamente
  const splash=document.getElementById('splash');
  if (splash) { splash.style.opacity='0'; setTimeout(()=>splash.remove(), 400); }
  // Mostrar app
  document.getElementById('app').style.display='block';
  // Chequear si el hash indica pantalla de reserva pública
  const hash = location.hash || '#/';
  if (hash === '#/reserva') {
    // Pantalla pública: no requiere login
    showScreen('reserva');
    renderReserva();
  } else {
    // Login o Main (Persistencia de sesión)
    await initLogin();
    if (auth.get()) {
      goTo('main');
    } else {
      showScreen('login');
    }
  }
  // Seeds en background (no bloquea el primer render)
  seeds().catch(e => console.warn('Seeds error:', e));
}

appInit();
</script>
